<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <!-- Outer Glowing Rings -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 6" />
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#avatarGrad)" stroke-width="3" opacity="0.8" />

  <!-- Developer Silhouette / Stylized Avatar -->
  <!-- Shoulders / Jacket -->
  <path d="M90 350 C90 280 140 250 200 250 C260 250 310 280 310 350 Z" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <path d="M140 350 L200 280 L260 350 Z" fill="#0f172a" />
  
  <!-- Inner shirt collar -->
  <polygon points="180,260 200,295 220,260" fill="#38bdf8" opacity="0.8" />

  <!-- Neck -->
  <rect x="180" y="210" width="40" height="50" rx="8" fill="#fcd34d" opacity="0.9" />

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="#fcd34d" />

  <!-- Modern Hair -->
  <path d="M140 165 C140 100 170 105 200 105 C230 105 260 115 260 165 C250 145 230 135 200 135 C170 135 150 145 140 165 Z" fill="#1e293b" />
  <!-- Hair top crest -->
  <path d="M145 145 C150 105 185 95 215 95 C245 95 260 115 260 135 C245 120 225 115 195 120 C165 125 150 135 145 145 Z" fill="#0f172a" />

  <!-- Glasses / Developer specs -->
  <rect x="155" y="165" width="35" height="22" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <rect x="210" y="165" width="35" height="22" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <line x1="190" y1="175" x2="210" y2="175" stroke="#38bdf8" stroke-width="3" />

  <!-- Smile -->
  <path d="M185 210 Q200 222 215 210" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" />

  <!-- Code Symbols floating -->
  <text x="50" y="120" fill="#38bdf8" font-family="monospace" font-size="28" font-weight="bold" opacity="0.6">&lt;/&gt;</text>
  <text x="320" y="140" fill="#a855f7" font-family="monospace" font-size="24" font-weight="bold" opacity="0.6">{ }</text>
  <text x="60" y="270" fill="#22c55e" font-family="monospace" font-size="20" font-weight="bold" opacity="0.5">=&gt;</text>
  <text x="315" y="260" fill="#f59e0b" font-family="monospace" font-size="22" font-weight="bold" opacity="0.5">JS</text>

  <!-- Name tag badge -->
  <rect x="110" y="340" width="180" height="34" rx="17" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
  <text x="200" y="362" fill="#e0e7ff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Md Shifat • Frontend</text>
</svg>
